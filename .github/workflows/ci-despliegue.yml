# CI de backend y frontend.
#
# Pull requests y pushes a main: typecheck, lint, formato y pruebas (las de integración levantan
# SQL Server y Redis con testcontainers en el runner de GitHub).
#
# Por ahora no hay despliegue automático: no se usa el runner self-hosted del servidor. El
# despliegue manual con docker compose está descrito en el README.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: Backend/.nvmrc
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm run test:unit
      # globalSetup levanta SQL Server 2022 y Redis con el Docker del runner, crea ShopCart_Test
      # y ejecuta Database/pruebas.
      - run: npm run test:integration

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: Frontend/.nvmrc
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm test
      - run: npm run build
