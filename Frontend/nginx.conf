server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # La API se sirve desde el mismo origen: la cookie del refresh token
    # (SameSite=Strict, Path=/api/auth) funciona sin configuración extra.
    location /api/ {
        # Por encima de IMAGENES_MAX_MB (5) para que el 413 lo responda el backend con su formato.
        client_max_body_size 6m;
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cabeceras de seguridad del sitio. Van en cada location de archivos estáticos y no en el server:
    # un add_header dentro de un location anula los heredados, y en /api/ ya las pone el backend (helmet).
    # Sin Content-Security-Policy: index.html lleva un script en línea que aplica el tema antes de pintar.

    # Archivos con hash en el nombre: caché larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Rutas de React Router: cualquier otra ruta devuelve index.html.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri /index.html;
    }
}
