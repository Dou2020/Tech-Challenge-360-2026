server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # La API se sirve desde el mismo origen: la cookie del refresh token
    # (SameSite=Strict, Path=/api/auth) funciona sin configuración extra.
    location /api/ {
        # Por encima de IMAGENES_MAX_MB (5) para que el 413 lo responda el backend con su formato.
        client_max_body_size 6m;
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos con hash en el nombre: caché larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Rutas de React Router: cualquier otra ruta devuelve index.html.
    location / {
        try_files $uri /index.html;
    }
}
