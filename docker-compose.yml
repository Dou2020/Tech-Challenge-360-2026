# Levanta ShopCart con Docker.
#
#   cp .env.example .env
#   docker compose up -d                          # SQL Server, Redis y creación de la base
#   docker compose --profile app up -d --build    # además backend y frontend
#   docker compose --profile app --profile tunel up -d   # además cloudflared (publica el frontend)
#
# Ver la sección "Inicializar y ejecutar el proyecto" del README.

name: shopcart

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en .env}
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Crea la base ejecutando Database/scripts en orden y termina.
  # Si la base ya existe la conserva, salvo que DB_RESET=true.
  # Con DB_PRUEBAS=true ejecuta además Database/pruebas (restricciones de integridad).
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      DB_SERVER: sqlserver
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Define APP_DB_PASSWORD en .env}
      DB_NAME: ${DB_NAME:-ShopCart}
      APP_DB_LOGIN: ${APP_DB_LOGIN:-shopcart_app}
      DB_RESET: ${DB_RESET:-false}
      DB_PRUEBAS: ${DB_PRUEBAS:-false}
    volumes:
      - ./Database:/database:ro
    entrypoint: ["bash", "/database/docker-init.sh"]
    restart: "no"

  # Sesiones (refresh tokens), revocación de access tokens, bloqueo de login,
  # rate limiting y caché. No guarda datos de negocio.
  # AOF para no perder sesiones al reiniciar; noeviction para no expulsar sesiones.
  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Servidor SMTP de desarrollo: recibe los correos (crear y recuperar contraseña) sin enviarlos.
  # Bandeja web en http://localhost:8025 y API en /api/v1/messages. En producción se cambian
  # SMTP_HOST, SMTP_PORT, SMTP_USER y SMTP_PASSWORD por los de un proveedor real.
  mailpit:
    image: axllent/mailpit:v1.31.0
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    profiles: ["app"]
    build: ./Backend
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4000"
      DB_SERVER: sqlserver
      DB_PORT: "1433"
      DB_NAME: ${DB_NAME:-ShopCart}
      DB_USER: ${APP_DB_LOGIN:-shopcart_app}
      DB_PASSWORD: ${APP_DB_PASSWORD:?Define APP_DB_PASSWORD en .env}
      DB_ENCRYPT: "true"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Define JWT_ACCESS_SECRET en .env}
      JWT_ACCESS_EXPIRES_IN: 15m
      REFRESH_TOKEN_DAYS: "7"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      RESERVAS_JOB_INTERVAL_MS: "60000"
      REDIS_URL: redis://redis:6379
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_REPORTES_SEG: ${CACHE_TTL_REPORTES_SEG:-300}
      CACHE_TTL_CATALOGO_SEG: ${CACHE_TTL_CATALOGO_SEG:-600}
      LOGIN_MAX_INTENTOS: ${LOGIN_MAX_INTENTOS:-5}
      LOGIN_BLOQUEO_MIN: ${LOGIN_BLOQUEO_MIN:-15}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-10}
      RATE_LIMIT_AUTH_VENTANA_MIN: ${RATE_LIMIT_AUTH_VENTANA_MIN:-15}
      RATE_LIMIT_CONTRASENA_MAX: ${RATE_LIMIT_CONTRASENA_MAX:-10}
      APP_URL_PUBLICA: ${APP_URL_PUBLICA:-http://localhost:8080}
      TOKEN_CREAR_HORAS: ${TOKEN_CREAR_HORAS:-72}
      TOKEN_RESTABLECER_MIN: ${TOKEN_RESTABLECER_MIN:-60}
      CORREO_TRANSPORTE: ${CORREO_TRANSPORTE:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-ShopCart <no-reply@shopcart.local>}
      IMAGENES_DIR: /app/datos/imagenes
      IMAGENES_MAX_MB: ${IMAGENES_MAX_MB:-5}
    volumes:
      - imagenes:/app/datos/imagenes
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    profiles: ["app"]
    build: ./Frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

  # Publica el frontend (nginx, que ya hace proxy de /api) en internet con un túnel de Cloudflare.
  # Crea el túnel en Cloudflare Zero Trust, apunta su hostname público a http://frontend:80 y
  # pon el token en TUNNEL_TOKEN (.env). Pon la misma URL pública en APP_URL_PUBLICA y CORS_ORIGIN.
  cloudflared:
    profiles: ["tunel"]
    image: cloudflare/cloudflared:2026.10.0
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  sqlserver-data:
  redis-data:
  # Imágenes de producto subidas al backend.
  imagenes:
