# Túnel de Cloudflare de ShopCart (gestionado localmente). Copia de referencia: en el servidor se
# instala en /etc/cloudflared/shopcart.yml y lo usa la unidad cloudflared-shopcart.service.
# Reemplaza <UUID-del-tunel> por el que imprime `cloudflared tunnel create shopcart`.
# El JSON de credenciales nunca se versiona (.gitignore: .cloudflared/*.json).

tunnel: <UUID-del-tunel>
credentials-file: /etc/cloudflared/<UUID-del-tunel>.json

ingress:
  # Un solo hostname: nginx sirve la SPA y reenvía /api al backend, así la cookie del refresh
  # token (SameSite=Strict, Path=/api/auth) queda en el mismo origen.
  - hostname: shopcart.iglesiasinai.org
    service: http://localhost:8090 # = FRONTEND_PORT del .env del servidor
  # Catch-all obligatorio: cloudflared no arranca si el ingress no termina con una regla sin hostname.
  - service: http_status:404
