        '200':
          description: Página de usuarios
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Usuario' }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Usuarios]
      summary: Crea un Operador o Administrador
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsuarioNuevo' }
      responses:
        '201':
          description: Usuario creado
          headers:
            Location:
              schema: { type: string, example: /api/usuarios/9 }
