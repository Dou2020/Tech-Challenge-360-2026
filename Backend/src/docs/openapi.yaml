  /configuracion/{clave}:
    put:
      tags: [Configuración]
      summary: Cambia el valor de un parámetro
      description: |
        MinutosReserva entero 1-120, HorasCarritoAbandonado entero 1-720, UmbralBajoStock entero
        ≥ 0, PorcentajeIVA decimal 0-100 con hasta 2 decimales. Fuera de rango: 400.
      security:
        - bearerAuth: []
      parameters:
        - name: clave
          in: path
          required: true
          schema: { type: string, example: UmbralBajoStock }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [valor]
              properties:
                valor:
                  oneOf:
                    - { type: string }
                    - { type: number }
      responses:
        '200':
          description: Parámetro actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Parametro' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieRefresh:
      type: apiKey
      in: cookie
      name: refreshToken
  headers:
    SetCookieRefresh:
      description: 'refreshToken=…; HttpOnly; Secure; SameSite=Strict; Path=/api/auth; Max-Age=604800'
      schema: { type: string }
    XCache:
      description: HIT si la respuesta salió de Redis, MISS si salió de la base
      schema: { type: string, enum: [HIT, MISS] }
  parameters:
    XCartToken:
      name: X-Cart-Token
      in: header
      required: false
      description: Token del carrito de invitado (UUID). Se ignora si hay Authorization
      schema: { type: string, format: uuid }
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Activo:
      name: activo
      in: query
      description: Sin el filtro, todos
      schema: { type: string, enum: ['true', 'false'] }
    Desde:
      name: desde
      in: query
      description: >-
        Inclusive. YYYY-MM-DD (desde las 00:00 de ese día en Guatemala, UTC-6) o instante ISO 8601
        con zona
      schema: { type: string, example: '2026-11-01' }
    ReporteDesde:
      name: desde
      in: query
      description: YYYY-MM-DD (día de Guatemala), inclusive
      schema: { type: string, format: date, example: '2026-10-01' }
    ReporteHasta:
      name: hasta
      in: query
      description: YYYY-MM-DD (día de Guatemala), inclusive; no menor que desde
      schema: { type: string, format: date, example: '2026-10-31' }
    Hasta:
      name: hasta
      in: query
      description: >-
        Inclusive. YYYY-MM-DD (hasta las 23:59:59.999 de ese día en Guatemala, UTC-6) o instante
        ISO 8601 con zona
      schema: { type: string, example: '2026-11-30' }
  responses:
    Error:
      description: Error con el formato estándar (ver el catálogo de códigos en API.md §4)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Registro:
      type: object
      required: [correo, contrasena, nombre, apellido]
      properties:
        correo: { type: string, format: email, maxLength: 150, example: ana@correo.gt }
        contrasena:
          type: string
          minLength: 8
          maxLength: 128
          description: Al menos una letra y un número
          example: Segura2026
        nombre: { type: string, minLength: 1, maxLength: 100, example: Ana }
        apellido: { type: string, minLength: 1, maxLength: 100, example: López }
        telefono:
          type: [string, 'null']
          maxLength: 20
          pattern: '^\+?[\d\s-]{8,20}$'
          example: 5555-1234
    Login:
      type: object
      required: [correo, contrasena]
      properties:
        correo: { type: string, format: email, example: cliente@shopcart.gt }
        contrasena: { type: string, example: 'Cliente#2026' }
    UsuarioSesion:
      type: object
      required: [idUsuario, nombre, apellido, correo, rol]
      properties:
        idUsuario: { type: integer, example: 12 }
        nombre: { type: string, example: Ana }
        apellido: { type: string, example: López }
        correo: { type: string, format: email, example: cliente@shopcart.gt }
        rol: { type: string, enum: [Cliente, Operador, Administrador] }
    AccessToken:
      type: object
      required: [accessToken, expiraEn]
      properties:
        accessToken: { type: string, description: JWT para Authorization Bearer }
        expiraEn: { type: integer, description: Segundos de vida del access token, example: 900 }
    Sesion:
      allOf:
        - { $ref: '#/components/schemas/AccessToken' }
        - type: object
          required: [usuario]
          properties:
            usuario: { $ref: '#/components/schemas/UsuarioSesion' }
    EstadoSistema:
      type: object
      required: [status, sqlServer, redis, timestamp]
      properties:
        status: { type: string, enum: [ok, degradado, caido] }
        sqlServer: { type: string, enum: [up, down] }
        redis: { type: string, enum: [up, down] }
        timestamp: { type: string, format: date-time }
    Error:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDACION }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
        requestId: { type: string }
    Page:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: {} }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    Monto:
      type: string
      pattern: '^\d{1,10}(\.\d{1,2})?$'
      description: Monto en quetzales con IVA, como string decimal (las respuestas siempre llevan 2 decimales)
      example: '149.00'
    ValorVariante:
      type: object
      properties:
        idAtributo: { type: integer }
        atributo: { type: string, example: Talla }
        idValorAtributo: { type: integer }
        valor: { type: string, example: M }
    Imagen:
      type: object
      properties:
        idProductoImagen: { type: integer }
        url: { type: string, format: uri }
        orden: { type: integer, minimum: 0, maximum: 255 }
        esPrincipal: { type: boolean }
    CategoriaPublica:
      type: object
      properties:
        idCategoria: { type: integer }
        nombre: { type: string }
        descripcion: { type: [string, 'null'] }
        cantidadProductos: { type: integer, description: Productos visibles en la tienda }
    MetodoEnvio:
      type: object
      properties:
        idMetodoEnvio: { type: integer }
        nombre: { type: string }
        costo: { $ref: '#/components/schemas/Monto' }
        diasEstimados: { type: integer }
    ProductoCatalogo:
      type: object
      properties:
        idProducto: { type: integer }
        nombre: { type: string }
        descripcion: { type: [string, 'null'] }
        idCategoria: { type: integer }
        categoria: { type: string }
        precioMinimo: { $ref: '#/components/schemas/Monto' }
        precioMaximo: { $ref: '#/components/schemas/Monto' }
        disponible:
          { type: boolean, description: Alguna variante activa tiene existencia disponible }
        imagenPrincipal: { type: [string, 'null'] }
        fechaCreacion: { type: string, format: date-time }
    ProductoPublico:
      type: object
      properties:
        idProducto: { type: integer }
        nombre: { type: string }
        descripcion: { type: [string, 'null'] }
        idCategoria: { type: integer }
        categoria: { type: string }
        precioMinimo: { $ref: '#/components/schemas/Monto' }
        precioMaximo: { $ref: '#/components/schemas/Monto' }
        disponible: { type: boolean }
        fechaCreacion: { type: string, format: date-time }
        imagenes:
          type: array
          items: { $ref: '#/components/schemas/Imagen' }
        variantes:
          type: array
          description: Solo variantes activas
          items:
            type: object
            properties:
              idVariante: { type: integer }
              sku: { type: string }
              precio: { $ref: '#/components/schemas/Monto' }
              existenciaDisponible: { type: integer }
              descripcion: { type: [string, 'null'], example: Talla M / Color Negro }
              valores:
                type: array
                items: { $ref: '#/components/schemas/ValorVariante' }
    Estado:
      type: object
      required: [activo]
      properties:
        activo: { type: boolean }
    CategoriaEntrada:
      type: object
      required: [nombre]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 100 }
        descripcion: { type: [string, 'null'], maxLength: 500 }
    Categoria:
      type: object
      properties:
        idCategoria: { type: integer }
        nombre: { type: string }
        descripcion: { type: [string, 'null'] }
        activo: { type: boolean }
        cantidadProductos: { type: integer }
        cantidadCupones: { type: integer }
    ProductoEntrada:
      type: object
      required: [idCategoria, nombre]
      properties:
        idCategoria: { type: integer, minimum: 1 }
        nombre: { type: string, minLength: 1, maxLength: 150 }
        descripcion: { type: [string, 'null'], maxLength: 4000 }
    VarianteNueva:
      type: object
      required: [sku, precio]
      properties:
        sku: { type: string, minLength: 1, maxLength: 50 }
        precio: { $ref: '#/components/schemas/Monto' }
        existenciaInicial: { type: integer, minimum: 0, default: 0 }
        valores:
          type: array
          description: idValorAtributo, como máximo uno por atributo
          items: { type: integer, minimum: 1 }
          default: []
    VarianteActualizada:
      type: object
      required: [sku]
      properties:
        sku: { type: string, minLength: 1, maxLength: 50 }
        valores:
          type: array
          description: Ausente conserva los actuales; [] los quita todos
          items: { type: integer, minimum: 1 }
    ProductoNuevo:
      allOf:
        - { $ref: '#/components/schemas/ProductoEntrada' }
        - type: object
          required: [variantes]
          properties:
            variantes:
              type: array
              minItems: 1
              maxItems: 50
              items: { $ref: '#/components/schemas/VarianteNueva' }
    ImagenEntrada:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri, maxLength: 500, description: http:// o https:// }
        orden: { type: integer, minimum: 0, maximum: 255, default: 0 }
        esPrincipal: { type: boolean, default: false }
    Variante:
      type: object
      properties:
        idVariante: { type: integer }
        idProducto: { type: integer }
        sku: { type: string }
        precio: { $ref: '#/components/schemas/Monto' }
        existenciaFisica: { type: integer }
        existenciaReservada: { type: integer, description: Solo reservas vigentes }
        existenciaDisponible: { type: integer }
        activo: { type: boolean }
        descripcion: { type: [string, 'null'] }
        valores:
          type: array
          items: { $ref: '#/components/schemas/ValorVariante' }
    Producto:
      type: object
      properties:
        idProducto: { type: integer }
        nombre: { type: string }
        descripcion: { type: [string, 'null'] }
        idCategoria: { type: integer }
        categoria: { type: string }
        categoriaActiva: { type: boolean }
        activo: { type: boolean }
        fechaCreacion: { type: string, format: date-time }
        fechaModificacion: { type: [string, 'null'], format: date-time }
        tieneVentas: { type: boolean }
        puedeEliminarse: { type: boolean, description: Sin ventas, kardex ni reservas }
        variantes:
          type: array
          items: { $ref: '#/components/schemas/Variante' }
        imagenes:
          type: array
          items: { $ref: '#/components/schemas/Imagen' }
    ProductoListado:
      type: object
      properties:
        idProducto: { type: integer }
        nombre: { type: string }
        idCategoria: { type: integer }
        categoria: { type: string }
        activo: { type: boolean }
        cantidadVariantes: { type: integer }
        cantidadVariantesActivas: { type: integer }
        precioMinimo: { oneOf: [{ $ref: '#/components/schemas/Monto' }, { type: 'null' }] }
        precioMaximo: { oneOf: [{ $ref: '#/components/schemas/Monto' }, { type: 'null' }] }
        existenciaFisica: { type: integer }
        existenciaReservada: { type: integer }
        existenciaDisponible: { type: integer }
        imagenPrincipal: { type: [string, 'null'] }
        fechaCreacion: { type: string, format: date-time }
        fechaModificacion: { type: [string, 'null'], format: date-time }
    Atributo:
      type: object
      properties:
        idAtributo: { type: integer }
        nombre: { type: string, example: Talla }
        cantidadValores: { type: integer }
        valores:
          type: array
          items:
            type: object
            properties:
              idValorAtributo: { type: integer }
              valor: { type: string, example: M }
              cantidadVariantes: { type: integer }
    TipoMovimiento:
      type: object
      properties:
        idTipoMovimientoInventario: { type: integer }
        codigo: { type: string, example: AJUSTE_SALIDA }
        nombre: { type: string, example: Ajuste de salida }
        signo: { type: integer, enum: [1, -1] }
    Existencia:
      type: object
      properties:
        idVariante: { type: integer }
        sku: { type: string }
        idProducto: { type: integer }
        producto: { type: string }
        idCategoria: { type: integer }
        categoria: { type: string }
        descripcion: { type: [string, 'null'], example: Talla M / Color Negro }
        precio: { $ref: '#/components/schemas/Monto' }
        existenciaFisica: { type: integer }
        existenciaReservada: { type: integer, description: Solo reservas vigentes }
        existenciaDisponible: { type: integer }
        bajoStock: { type: boolean, description: existenciaDisponible ≤ umbralBajoStock }
        umbralBajoStock: { type: integer, example: 5 }
        activo: { type: boolean }
        productoActivo: { type: boolean }
        categoriaActiva: { type: boolean }
    Movimiento:
      type: object
      properties:
        idMovimientoInventario:
          { type: integer, format: int64, description: BIGINT; en JSON como número }
        idVariante: { type: integer }
        fecha: { type: string, format: date-time }
        codigoTipoMovimiento: { type: string, example: AJUSTE_SALIDA }
        nombreTipoMovimiento: { type: string }
        signo: { type: integer, enum: [1, -1] }
        cantidad: { type: integer, minimum: 1 }
        existenciaAnterior: { type: integer }
        existenciaNueva: { type: integer, description: existenciaAnterior + signo × cantidad }
        motivo: { type: string }
        idUsuario: { type: integer }
        usuario: { type: string }
        idPedido: { type: [integer, 'null'] }
        numeroPedido: { type: [string, 'null'] }
        idDevolucion: { type: [integer, 'null'] }
    MovimientoRegistrado:
      allOf:
        - { $ref: '#/components/schemas/Movimiento' }
        - type: object
          description: Existencia de la variante después del movimiento
          properties:
            sku: { type: string }
            existenciaFisica: { type: integer }
            existenciaReservada: { type: integer }
            existenciaDisponible: { type: integer }
    DireccionEntrada:
      type: object
      required: [alias, nombreDestinatario, telefono, linea1, municipio, departamento]
      properties:
        alias: { type: string, minLength: 1, maxLength: 50, example: Casa }
        nombreDestinatario: { type: string, minLength: 1, maxLength: 150 }
        telefono: { type: string, maxLength: 20, pattern: '^\+?[\d\s-]{8,20}$', example: 5555-1234 }
        linea1: { type: string, minLength: 1, maxLength: 200 }
        linea2: { type: [string, 'null'], maxLength: 200 }
        municipio: { type: string, minLength: 1, maxLength: 100 }
        departamento: { type: string, minLength: 1, maxLength: 100 }
        codigoPostal: { type: [string, 'null'], pattern: '^\d{5}$', example: '01001' }
        referencias: { type: [string, 'null'], maxLength: 300 }
    Direccion:
      allOf:
        - type: object
          properties:
            idDireccion: { type: integer }
        - { $ref: '#/components/schemas/DireccionEntrada' }

    CuponCarrito:
      type: object
      properties:
        idCupon: { type: integer }
        codigo: { type: string }
        descripcion: { type: [string, 'null'] }
        tipoDescuento: { type: string, enum: [PORCENTAJE, MONTO_FIJO] }
        valor: { $ref: '#/components/schemas/Monto' }
        idCategoria: { type: [integer, 'null'] }
        categoria: { type: [string, 'null'] }
        aplicado: { type: boolean, description: false si el cupón guardado ya no vale }
        codigoError: { type: [string, 'null'], example: CUPON_VENCIDO }
        mensajeError: { type: [string, 'null'] }
    ItemCarrito:
      type: object
      properties:
        idCarritoDetalle: { type: integer }
        idVariante: { type: integer }
        sku: { type: string }
        idProducto: { type: integer }
        producto: { type: string }
        idCategoria: { type: integer }
        categoria: { type: string }
        variante: { type: [string, 'null'] }
        imagen: { type: [string, 'null'] }
        precioUnitario: { $ref: '#/components/schemas/Monto' }
        cantidad: { type: integer }
        importe: { $ref: '#/components/schemas/Monto' }
        descuentoLinea: { $ref: '#/components/schemas/Monto' }
        importeNeto: { $ref: '#/components/schemas/Monto' }
        elegibleCupon: { type: boolean }
        existenciaDisponible: { type: integer, description: Sin contar la reserva propia }
        vendible: { type: boolean }
        excedeDisponible: { type: boolean }
        requiereAjuste: { type: boolean }
        fechaAgregado: { type: string, format: date-time }
    Carrito:
      type: object
      properties:
        idCarrito: { type: [integer, 'null'] }
        tokenInvitado: { type: string, format: uuid, description: Solo a invitados }
        items:
          type: array
          items: { $ref: '#/components/schemas/ItemCarrito' }
        cupon:
          oneOf:
            - { $ref: '#/components/schemas/CuponCarrito' }
            - { type: 'null' }
        cantidadLineas: { type: integer }
        cantidadUnidades: { type: integer }
        subtotal: { $ref: '#/components/schemas/Monto' }
        descuento: { $ref: '#/components/schemas/Monto' }
        total: { $ref: '#/components/schemas/Monto' }
        porcentajeIVA: { $ref: '#/components/schemas/Monto' }
        montoIVA: { $ref: '#/components/schemas/Monto' }
        lineasRequierenAjuste: { type: integer }
    CarritoFusionado:
      allOf:
        - { $ref: '#/components/schemas/Carrito' }
        - type: object
          properties:
            fusion:
              type: array
              items:
                type: object
                properties:
                  idVariante: { type: integer }
                  sku: { type: string }
                  cantidadInvitado: { type: integer }
                  cantidadAnterior: { type: integer }
                  cantidadFinal: { type: integer }
                  cantidadAgregada: { type: integer }
                  recortada: { type: boolean }
    CuponEntrada:
      type: object
      required: [codigo, tipoDescuento, valor, fechaInicio, fechaFin, limiteUsosTotal]
      properties:
        codigo:
          {
            type: string,
            maxLength: 30,
            pattern: '^[A-Za-z0-9_-]+$',
            description: Se guarda en mayúsculas,
          }
        descripcion: { type: [string, 'null'], maxLength: 300 }
        tipoDescuento: { type: string, enum: [PORCENTAJE, MONTO_FIJO] }
        valor: { $ref: '#/components/schemas/Monto' }
        idCategoria: { type: [integer, 'null'], description: Sin ella aplica a todo el carrito }
        montoMinimo: { $ref: '#/components/schemas/Monto' }
        fechaInicio: { type: string, format: date-time, description: ISO 8601 con zona }
        fechaFin: { type: string, format: date-time, description: Posterior a fechaInicio }
        limiteUsosTotal: { type: integer, minimum: 1 }
        limiteUsosPorCliente: { type: integer, minimum: 1, default: 1 }
    Cupon:
      type: object
      properties:
        idCupon: { type: integer }
        codigo: { type: string }
        descripcion: { type: [string, 'null'] }
        tipoDescuento: { type: string, enum: [PORCENTAJE, MONTO_FIJO] }
        valor: { $ref: '#/components/schemas/Monto' }
        idCategoria: { type: [integer, 'null'] }
        categoria: { type: [string, 'null'] }
        montoMinimo: { $ref: '#/components/schemas/Monto' }
        fechaInicio: { type: string, format: date-time }
        fechaFin: { type: string, format: date-time }
        limiteUsosTotal: { type: integer }
        limiteUsosPorCliente: { type: integer }
        usosActuales: { type: integer }
        usosDisponibles: { type: integer }
        activo: { type: boolean }
        vigente: { type: boolean, description: Solo mira las fechas }
        agotado: { type: boolean }
        cantidadPedidos: { type: integer, description: Incluye cancelados }
        cantidadCarritos: { type: integer }
        puedeEliminarse: { type: boolean }
    UsoCupon:
      type: object
      properties:
        idUsoCupon: { type: integer }
        idPedido: { type: integer }
        numeroPedido: { type: string }
        idUsuario: { type: integer }
        cliente: { type: string }
        correo: { type: string }
        descuento: { $ref: '#/components/schemas/Monto' }
        totalPedido: { $ref: '#/components/schemas/Monto' }
        estadoPedido: { type: string }
        fecha: { type: string, format: date-time }
    Usuario:
      type: object
      required: [idUsuario, correo, nombre, apellido, telefono, rol, activo, fechaCreacion]
      properties:
        idUsuario: { type: integer }
        correo: { type: string, format: email }
        nombre: { type: string }
        apellido: { type: string }
        telefono: { type: [string, 'null'] }
        rol: { type: string, enum: [Cliente, Operador, Administrador] }
        activo: { type: boolean }
        fechaCreacion: { type: string, format: date-time }
    PerfilEntrada:
      type: object
      required: [nombre, apellido]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 100 }
        apellido: { type: string, minLength: 1, maxLength: 100 }
        telefono: { type: [string, 'null'], maxLength: 20, pattern: '^\+?[\d\s-]{8,20}$' }
    UsuarioNuevo:
      type: object
      required: [correo, contrasena, nombre, apellido, rol]
      properties:
        correo: { type: string, format: email, maxLength: 150 }
        contrasena: { type: string, minLength: 8, maxLength: 128 }
        nombre: { type: string, maxLength: 100 }
        apellido: { type: string, maxLength: 100 }
        telefono: { type: [string, 'null'], maxLength: 20 }
        rol: { type: string, enum: [Operador, Administrador] }
    UsuarioActualizacion:
      type: object
      required: [nombre, apellido]
      properties:
        nombre: { type: string, maxLength: 100 }
        apellido: { type: string, maxLength: 100 }
        telefono: { type: [string, 'null'], maxLength: 20 }
        rol:
          {
            type: string,
            enum: [Cliente, Operador, Administrador],
            description: Sin rol se conserva,
