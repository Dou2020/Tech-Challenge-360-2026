openapi: 3.1.0
info:
  title: ShopCart API
  version: 1.0.0
  description: |
    API REST de ShopCart. La referencia completa de endpoints, accesos por rol,
    stored procedures y códigos de error está en Backend/API.md.
servers:
  - url: /api
tags:
  - name: Sistema
  - name: Autenticación
  - name: Catálogo público
  - name: Categorías
    description: Solo Administrador
  - name: Productos
    description: Solo Administrador
  - name: Variantes
    description: Solo Administrador
  - name: Atributos
    description: Solo Administrador
  - name: Inventario
    description: Operador y Administrador
  - name: Direcciones
    description: Solo Cliente; una dirección ajena responde 404
  - name: Carrito
    description: Invitado (X-Cart-Token) o Cliente; nunca se cachea
  - name: Cupones
    description: Solo Administrador
  - name: Checkout
    description: Solo Cliente; el pago exige Idempotency-Key
  - name: Pedidos
    description: Cliente (propios), Operador y Administrador
  - name: Perfil
    description: Cualquier rol autenticado
  - name: Usuarios
    description: Solo Administrador
  - name: Reportes
    description: Solo Administrador; días de Guatemala; con caché (X-Cache)
  - name: Bitácora
    description: Solo Administrador, solo lectura
  - name: Configuración
    description: Solo Administrador
paths:
  /health:
    get:
      tags: [Sistema]
      summary: Estado del servicio y de sus dependencias
      responses:
        '200':
          description: SQL Server responde (Redis puede estar caído → status "degradado")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoSistema' }
        '503':
          description: SQL Server no responde
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoSistema' }
  /auth/registro:
    post:
      tags: [Autenticación]
      summary: Registra un Cliente y abre su sesión (igual que el login)
      description: |
        Límite por IP: 10 solicitudes cada 15 minutos (429 DEMASIADAS_SOLICITUDES).
        El correo se guarda sin espacios y en minúsculas.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Registro' }
      responses:
        '201':
          description: Cliente creado. Deja la cookie refreshToken.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookieRefresh' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '400': { $ref: '#/components/responses/Error' }
        '409':
          description: DUPLICADO (el correo ya está registrado)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [Autenticación]
      summary: Inicia sesión
      description: |
        Credenciales incorrectas → 401 CREDENCIALES_INVALIDAS (mismo mensaje si el correo no existe).
        Usuario desactivado → 403 USUARIO_INACTIVO (solo con la contraseña correcta).
        Al llegar a 5 fallos seguidos con el mismo correo → 429 CUENTA_BLOQUEADA con Retry-After
        durante 15 minutos, aun con la contraseña correcta. Límite por IP: 10 cada 15 minutos
        (429 DEMASIADAS_SOLICITUDES). Si Redis no responde → 503 SERVICIO_NO_DISPONIBLE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Login' }
      responses:
        '200':
          description: Sesión abierta. Deja la cookie refreshToken.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookieRefresh' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429':
          description: CUENTA_BLOQUEADA o DEMASIADAS_SOLICITUDES
          headers:
            Retry-After:
              description: Segundos que faltan para volver a intentar
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      tags: [Autenticación]
      summary: Rota el refresh token y entrega un access token nuevo
      description: |
        Usa la cookie refreshToken. El access token nuevo lleva el rol actual del usuario.
        Token vencido, revocado o reutilizado → 401 REFRESH_INVALIDO y se borra la cookie;
        si fue reutilizado (ya se había rotado), además se revoca la sesión completa.
        Usuario desactivado → 403 USUARIO_INACTIVO.
      security:
        - cookieRefresh: []
      responses:
        '200':
          description: Token rotado. Deja la cookie refreshToken nueva.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookieRefresh' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessToken' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [Autenticación]
      summary: Cierra la sesión
      description: |
        Revoca el access token del header Authorization (si viene) y la sesión de la cookie,
        y borra la cookie. Los access tokens de esa sesión dejan de aceptarse de inmediato.
        Es idempotente: sin sesión también responde 204.
      security:
        - cookieRefresh: []
        - bearerAuth: []
      responses:
        '204':
          description: Sesión cerrada
        '503': { $ref: '#/components/responses/Error' }
  /auth/me:
    get:
      tags: [Autenticación]
      summary: Usuario de la sesión
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuario de la sesión
          headers:
            X-Cache: { $ref: '#/components/headers/XCache' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioSesion' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /catalogo/categorias:
    get:
      tags: [Catálogo público]
      summary: Categorías activas con la cantidad de productos visibles
      responses:
        '200':
          description: Arreglo de categorías, por nombre
          headers:
            X-Cache: { $ref: '#/components/headers/XCache' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CategoriaPublica' }
  /catalogo/productos:
    get:
      tags: [Catálogo público]
      summary: Búsqueda paginada de productos visibles (sin caché)
      description: |
        Visible = producto activo, categoría activa y al menos una variante activa.
        precioMin/precioMax filtran sobre el precio mínimo del producto. Sin caché: trae `disponible`.
      parameters:
        - {
            name: q,
            in: query,
            schema: { type: string, maxLength: 150 },
            description: Nombre,
            descripción,
            categoría o SKU,
          }
        - { name: idCategoria, in: query, schema: { type: integer, minimum: 1 } }
        - { name: precioMin, in: query, schema: { $ref: '#/components/schemas/Monto' } }
        - { name: precioMax, in: query, schema: { $ref: '#/components/schemas/Monto' } }
        - name: disponible
          in: query
          description: true con existencia disponible, false agotados; sin el filtro, todos
          schema: { type: string, enum: ['true', 'false'] }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - name: sort
          in: query
          schema:
            type: string
            enum:
              [
                precio:asc,
                precio:desc,
                nombre:asc,
                nombre:desc,
                fechaCreacion:asc,
                fechaCreacion:desc,
              ]
            default: fechaCreacion:desc
      responses:
        '200':
          description: Página de productos
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ProductoCatalogo' }
        '400': { $ref: '#/components/responses/Error' }
  /catalogo/productos/{id}:
    get:
      tags: [Catálogo público]
      summary: Detalle público con variantes activas y existencia disponible (sin caché)
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Producto visible
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductoPublico' }
        '400': { $ref: '#/components/responses/Error' }
        '404':
          description: NO_ENCONTRADO (no existe, inactivo, categoría inactiva o sin variantes activas)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /metodos-envio:
    get:
      tags: [Catálogo público]
      summary: Métodos de envío activos, por costo
      responses:
        '200':
          description: Arreglo de métodos de envío
          headers:
            X-Cache: { $ref: '#/components/headers/XCache' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MetodoEnvio' }
  /categorias:
    get:
      tags: [Categorías]
      summary: Lista paginada de categorías, incluye inactivas
      security:
        - bearerAuth: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { $ref: '#/components/parameters/Activo' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - name: sort
          in: query
          schema:
            type: string
            enum:
              [
                nombre:asc,
                nombre:desc,
                activo:asc,
                activo:desc,
                cantidadProductos:asc,
                cantidadProductos:desc,
              ]
            default: nombre:asc
      responses:
        '200':
          description: Página de categorías
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Categoria' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Categorías]
      summary: Crea una categoría
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoriaEntrada' }
      responses:
        '201':
          description: Categoría creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Categoria' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409':
          description: DUPLICADO (nombre repetido)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /categorias/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Categorías]
      summary: Detalle de una categoría
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Categoría
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Categoria' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [Categorías]
      summary: Reemplaza nombre y descripción (omitir descripcion la borra)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoriaEntrada' }
      responses:
        '200':
          description: Categoría actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Categoria' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Categorías]
      summary: Elimina una categoría sin productos ni cupones
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Eliminada
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: EN_USO (tiene productos, aun inactivos, o cupones)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /categorias/{id}/estado:
    patch:
      tags: [Categorías]
      summary: Activa o desactiva (desactivar oculta sus productos de la tienda)
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Estado' }
      responses:
        '200':
          description: Categoría con el estado nuevo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Categoria' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /productos:
    get:
      tags: [Productos]
      summary: Lista paginada de productos, incluye inactivos
      security:
        - bearerAuth: []
      parameters:
        - {
            name: q,
            in: query,
            schema: { type: string, maxLength: 150 },
            description: Nombre o SKU,
          }
        - { name: idCategoria, in: query, schema: { type: integer, minimum: 1 } }
        - { $ref: '#/components/parameters/Activo' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - name: sort
          in: query
          schema:
            type: string
            enum:
              [
                nombre:asc,
                nombre:desc,
                categoria:asc,
                categoria:desc,
                precio:asc,
                precio:desc,
                existencia:asc,
                existencia:desc,
                fechaCreacion:asc,
                fechaCreacion:desc,
              ]
            default: fechaCreacion:desc
      responses:
        '200':
          description: Página de productos
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ProductoListado' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Productos]
      summary: Crea el producto con sus variantes en una transacción
      description: |
        La existencia inicial entra como movimiento de kardex INVENTARIO_INICIAL.
        Dos valores del mismo atributo en una variante, o dos variantes con la misma
        combinación → 400 VALIDACION. SKU repetido → 409 DUPLICADO. Categoría inexistente → 404.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductoNuevo' }
      responses:
        '201':
          description: Producto creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producto' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /productos/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Productos]
      summary: Detalle de gestión con todas las variantes y existencias
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Producto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producto' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [Productos]
      summary: Reemplaza nombre, descripción y categoría
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductoEntrada' }
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producto' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Productos]
      summary: Elimina un producto sin ventas, kardex ni reservas
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Eliminado (con sus imágenes, variantes y líneas de carrito)
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: PRODUCTO_CON_VENTAS (se debe desactivar) o EN_USO (tiene kardex o reservas)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /productos/{id}/estado:
    patch:
      tags: [Productos]
      summary: Activa o desactiva (un producto inactivo no se ve en la tienda)
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Estado' }
      responses:
        '200':
          description: Producto con el estado nuevo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producto' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /productos/{id}/imagenes:
    post:
      tags: [Productos]
      summary: Agrega una imagen por URL
      description: Si el producto no tenía principal, la nueva lo es; esPrincipal true reemplaza la anterior.
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImagenEntrada' }
      responses:
        '201':
          description: Producto con sus imágenes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producto' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /productos/{id}/imagenes/{idImagen}:
    delete:
      tags: [Productos]
      summary: Quita una imagen (si era la principal, pasa a la siguiente por orden)
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: idImagen, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '204':
          description: Imagen eliminada
        '404':
          description: NO_ENCONTRADO (también si la imagen es de otro producto)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /productos/{id}/variantes:
    post:
      tags: [Productos]
      summary: Agrega una variante al producto
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VarianteNueva' }
      responses:
        '201':
          description: Variante creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Variante' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /variantes/{id}:
    put:
      tags: [Variantes]
      summary: Actualiza SKU y valores de atributo (la existencia no se edita aquí)
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VarianteActualizada' }
      responses:
        '200':
          description: Variante actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Variante' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /variantes/{id}/precio:
    patch:
      tags: [Variantes]
      summary: Cambia el precio (queda en la bitácora; no altera pedidos ya realizados)
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [precio]
              properties:
                precio: { $ref: '#/components/schemas/Monto' }
      responses:
        '200':
          description: Variante con el precio nuevo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Variante' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /variantes/{id}/estado:
    patch:
      tags: [Variantes]
      summary: Activa o desactiva la variante
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Estado' }
      responses:
        '200':
          description: Variante con el estado nuevo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Variante' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /atributos:
    get:
      tags: [Atributos]
      summary: Atributos con sus valores
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Arreglo de atributos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Atributo' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Atributos]
      summary: Crea un atributo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre: { type: string, minLength: 1, maxLength: 50, example: Material }
      responses:
        '201':
          description: Atributo creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  idAtributo: { type: integer }
                  nombre: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /atributos/{id}/valores:
    post:
      tags: [Atributos]
      summary: Agrega un valor a un atributo
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [valor]
              properties:
                valor: { type: string, minLength: 1, maxLength: 50, example: Algodón }
      responses:
        '201':
          description: Valor creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  idValorAtributo: { type: integer }
                  idAtributo: { type: integer }
                  atributo: { type: string }
                  valor: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /inventario/tipos-movimiento:
    get:
      tags: [Inventario]
      summary: Tipos de movimiento para el filtro del kardex
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tipos, primero los que suman
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TipoMovimiento' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /inventario/existencias:
    get:
      tags: [Inventario]
      summary: Existencias por variante (incluye inactivas); sin caché
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: SKU o nombre del producto
          schema: { type: string, maxLength: 150 }
        - { name: idCategoria, in: query, schema: { type: integer, minimum: 1 } }
        - name: bajoStock
          in: query
          description: true disponible ≤ umbral, false mayor; sin el filtro, todas
          schema: { type: string, enum: ['true', 'false'] }
        - { $ref: '#/components/parameters/Activo' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - name: sort
          in: query
          schema:
            type: string
            enum:
              [
                sku:asc,
                sku:desc,
                producto:asc,
                producto:desc,
                categoria:asc,
                categoria:desc,
                existenciaFisica:asc,
                existenciaFisica:desc,
                existenciaReservada:asc,
                existenciaReservada:desc,
                existenciaDisponible:asc,
                existenciaDisponible:desc,
              ]
            default: existenciaDisponible:asc
      responses:
        '200':
          description: Página de existencias
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Existencia' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /inventario/variantes/{idVariante}/kardex:
    get:
      tags: [Inventario]
      summary: Kardex de una variante
      security:
        - bearerAuth: []
      parameters:
        - name: idVariante
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - { $ref: '#/components/parameters/Desde' }
        - { $ref: '#/components/parameters/Hasta' }
        - name: tipo
          in: query
          description: Código del tipo de movimiento, sin distinguir mayúsculas
          schema: { type: string, maxLength: 30, example: AJUSTE_SALIDA }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - name: sort
          in: query
          schema: { type: string, enum: [fecha:asc, fecha:desc], default: fecha:desc }
      responses:
        '200':
          description: Página de movimientos
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Movimiento' }
        '400':
          description: VALIDACION (fecha mal formada, desde > hasta, tipo inexistente, sort)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /inventario/entradas:
    post:
      tags: [Inventario]
      summary: Entrada por compra (kardex ENTRADA_COMPRA)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idVariante, cantidad]
              properties:
                idVariante: { type: integer, minimum: 1 }
                cantidad: { type: integer, minimum: 1, maximum: 1000000 }
                motivo:
                  type: [string, 'null']
                  maxLength: 300
                  description: Sin él queda 'Entrada por compra'
      responses:
        '201':
          description: Movimiento registrado y existencia resultante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovimientoRegistrado' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /inventario/ajustes:
    post:
      tags: [Inventario]
      summary: Ajuste manual (kardex AJUSTE_ENTRADA o AJUSTE_SALIDA)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idVariante, tipo, cantidad, motivo]
              properties:
                idVariante: { type: integer, minimum: 1 }
                tipo: { type: string, enum: [ENTRADA, SALIDA] }
                cantidad: { type: integer, minimum: 1, maximum: 1000000 }
                motivo:
                  { type: string, minLength: 1, maxLength: 300, example: Producto dañado en bodega }
      responses:
        '201':
          description: Movimiento registrado y existencia resultante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovimientoRegistrado' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422':
          description: EXISTENCIA_NEGATIVA (la salida deja la existencia en negativo o bajo lo reservado)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /direcciones:
    get:
      tags: [Direcciones]
      summary: Direcciones activas del cliente (sin paginar)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Direcciones por idDireccion
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Direccion' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Direcciones]
      summary: Crea una dirección
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DireccionEntrada' }
      responses:
        '201':
          description: Dirección creada
          headers:
            Location:
              schema: { type: string, example: /api/direcciones/5 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Direccion' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /direcciones/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Direcciones]
      summary: Una dirección propia y activa
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dirección
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Direccion' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404':
          description: NO_ENCONTRADO (inexistente, dada de baja o de otro cliente)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [Direcciones]
      summary: Reemplaza todos los campos (omitir un opcional lo borra)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DireccionEntrada' }
      responses:
        '200':
          description: Dirección actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Direccion' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Direcciones]
      summary: Baja lógica (los pedidos conservan su copia)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Dada de baja
