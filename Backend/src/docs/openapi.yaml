        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /carrito:
    get:
      tags: [Carrito]
      summary: Carrito actual (vacío con idCarrito null si no existe)
      description: Con Authorization manda el usuario (solo Cliente; otro rol 403) y el X-Cart-Token se ignora.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/XCartToken' }
      responses:
        '200':
          description: Carrito completo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Carrito' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Carrito]
      summary: Vacía el carrito y quita el cupón
      security:
        - {}
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/XCartToken' }
      responses:
        '200':
          description: Carrito completo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Carrito' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /carrito/items:
    post:
      tags: [Carrito]
      summary: Agrega una variante (suma si ya está); crea el carrito
      description: Al invitado sin carrito le devuelve tokenInvitado. Variante inactiva o inexistente 404; más de lo disponible 409 STOCK_INSUFICIENTE.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/XCartToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idVariante, cantidad]
              properties:
                idVariante: { type: integer, minimum: 1 }
                cantidad: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        '200':
          description: Carrito completo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Carrito' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /carrito/items/{idVariante}:
    parameters:
      - name: idVariante
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      tags: [Carrito]
      summary: Cambia la cantidad de una línea
      security:
        - {}
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/XCartToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cantidad]
              properties:
                cantidad: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        '200':
          description: Carrito completo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Carrito' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Carrito]
      summary: Quita una línea (conserva el cupón)
      security:
        - {}
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/XCartToken' }
      responses:
        '200':
          description: Carrito completo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Carrito' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /carrito/cupon:
    post:
      tags: [Carrito]
      summary: Aplica un cupón (reemplaza al anterior)
      description: Un invitado recibe 401. Un cupón inválido responde 422 con su código (CUPON_*).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo]
              properties:
                codigo: { type: string, maxLength: 30, example: BIENVENIDA10 }
      responses:
        '200':
          description: Carrito completo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Carrito' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Carrito]
      summary: Quita el cupón (sin cupón no es error)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Carrito completo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Carrito' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /carrito/fusionar:
    post:
      tags: [Carrito]
      summary: Pasa el carrito de invitado al del cliente
      description: >-
        El token va en el body o, si no viene, en el header X-Cart-Token. Suma recortando a lo
        disponible; repetirla o un token inexistente no cambia nada.
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/XCartToken' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tokenInvitado: { type: string, format: uuid }
      responses:
        '200':
          description: Carrito del cliente más el resumen de la fusión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarritoFusionado' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /cupones:
    get:
      tags: [Cupones]
      summary: Lista paginada de cupones
      security:
        - bearerAuth: []
      parameters:
        - {
            name: q,
            in: query,
            description: Código (contiene),
            schema: { type: string, maxLength: 100 },
          }
        - { $ref: '#/components/parameters/Activo' }
        - {
            name: vigente,
            in: query,
            description: Solo mira las fechas,
            schema: { type: string, enum: ['true', 'false'] },
          }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - name: sort
          in: query
          description: 'campo:asc|desc con codigo, fechaInicio, fechaFin, usosActuales o valor'
          schema: { type: string, default: 'codigo:asc' }
      responses:
        '200':
          description: Página de cupones
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Cupon' }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Cupones]
      summary: Crea un cupón (activo, sin usos)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CuponEntrada' }
      responses:
        '201':
          description: Cupón creado
          headers:
            Location:
              schema: { type: string, example: /api/cupones/9 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cupon' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /cupones/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Cupones]
      summary: Detalle de un cupón
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cupón
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cupon' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [Cupones]
      summary: Reemplaza lo editable (no cambia activo ni usos)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CuponEntrada' }
      responses:
        '200':
          description: Cupón actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cupon' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Cupones]
      summary: Elimina un cupón sin pedidos ni carritos
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Eliminado
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: EN_USO (algún pedido, aunque cancelado, o carrito lo tiene)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /cupones/{id}/estado:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    patch:
      tags: [Cupones]
      summary: Activa o desactiva
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activo]
              properties:
                activo: { type: boolean }
      responses:
        '200':
          description: Cupón actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cupon' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /cupones/{id}/usos:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Cupones]
      summary: Usos del cupón (excluye pedidos cancelados)
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - name: sort
          in: query
          description: 'campo:asc|desc con fecha o descuento'
          schema: { type: string, default: 'fecha:desc' }
      responses:
        '200':
          description: Página de usos
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/UsoCupon' }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /checkout/iniciar:
    post:
      tags: [Checkout]
      summary: Revalida el cupón, reserva la existencia (15 min) y devuelve el resumen
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idDireccion, idMetodoEnvio]
              properties:
                idDireccion: { type: integer, minimum: 1 }
                idMetodoEnvio: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Resumen con la reserva vigente. Reemplaza la reserva anterior
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumenCheckout' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404':
          description: NO_ENCONTRADO (dirección ajena, dada de baja o inexistente; método inactivo)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: STOCK_INSUFICIENTE; `details` trae una entrada por variante afectada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: El cupón del carrito ya no aplica (CUPON_VENCIDO, CUPON_AGOTADO, …)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /checkout:
    get:
      tags: [Checkout]
      summary: Resumen y reserva vigente (retomar el checkout)
      security:
        - bearerAuth: []
      parameters:
        - name: idMetodoEnvio
          in: query
          description: Sin método, costoEnvio es 0.00 (el método no se guarda en la reserva)
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Resumen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumenCheckout' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: RESERVA_VENCIDA (no hay reserva vigente que cubra el carrito)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /checkout/reserva:
    delete:
      tags: [Checkout]
      summary: Libera la reserva (el cliente vuelve al carrito)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Liberada (también si no había reserva)
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /checkout/pagar:
    post:
      tags: [Checkout]
      summary: Pago simulado idempotente; crea el pedido de forma atómica
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID v4 generado una vez por intento de pago y reutilizado en los reintentos
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idDireccion, idMetodoEnvio, metodoPago, datosPago]
              properties:
                idDireccion: { type: integer, minimum: 1 }
                idMetodoEnvio: { type: integer, minimum: 1 }
                metodoPago: { type: string, enum: [TARJETA] }
                datosPago:
                  type: object
                  required: [titular, ultimos4]
                  properties:
                    titular: { type: string, maxLength: 150 }
                    ultimos4: { type: string, pattern: '^\d{4}$', description: '0000 se rechaza' }
      responses:
        '200':
          description: Repetición de la misma clave y el mismo carrito. Devuelve el mismo pedido
          headers:
            Location: { schema: { type: string, example: /api/pedidos/1503 } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PedidoCreado' }
        '201':
          description: Pedido creado
          headers:
            Location: { schema: { type: string, example: /api/pedidos/1503 } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PedidoCreado' }
        '400':
          description: VALIDACION o IDEMPOTENCY_KEY_REQUERIDA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '402':
          description: PAGO_RECHAZADO (la reserva sigue vigente)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: IDEMPOTENCIA_CONFLICTO (otro carrito o clave de otro cliente) o RESERVA_VENCIDA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Cupón rechazado al pagar (CUPON_AGOTADO, CUPON_VENCIDO, …)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /pedidos:
    get:
      tags: [Pedidos]
      summary: Lista paginada (el Cliente solo ve los suyos)
      security:
        - bearerAuth: []
      parameters:
        - { name: estado, in: query, schema: { type: string, example: PAGADO } }
        - name: idCliente
          in: query
          description: Solo personal; un Cliente lo ignora
          schema: { type: integer, minimum: 1 }
        - { $ref: '#/components/parameters/Desde' }
        - { $ref: '#/components/parameters/Hasta' }
        - {
            name: q,
            in: query,
            description: Número de pedido (parcial),
            schema: { type: string, maxLength: 50 },
          }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - name: sort
          in: query
          schema:
            type: string
            default: fechaCreacion:desc
            enum: [fechaCreacion:asc, fechaCreacion:desc, total:asc, total:desc]
      responses:
        '200':
          description: Página de pedidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PedidoResumen' }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /pedidos/estados:
    get:
      tags: [Pedidos]
      summary: Estados y transiciones (con las permitidas al rol del solicitante)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estados y transiciones
          content:
            application/json:
              schema:
                type: object
                properties:
                  estados:
                    type: array
                    items:
                      type: object
                      properties:
                        codigo: { type: string }
                        nombre: { type: string }
                        esFinal: { type: boolean }
                  transiciones:
                    type: array
                    items:
                      type: object
                      properties:
                        origen: { type: string }
                        destino: { type: string }
                        rol: { type: string }
                        permitida: { type: boolean, description: Para el rol del solicitante }
                        via: { type: string, enum: [ESTADO, CANCELAR, DEVOLUCION] }
        '401': { $ref: '#/components/responses/Error' }
  /pedidos/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Pedidos]
      summary: Detalle con líneas congeladas y transiciones posibles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pedido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PedidoDetalle' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404':
          description: NO_ENCONTRADO (no existe o es de otro cliente)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /pedidos/{id}/historial:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Pedidos]
      summary: Cambios de estado, del más antiguo al más reciente
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Historial
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CambioEstado' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /pedidos/{id}/cancelar:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Pedidos]
      summary: Cancela antes del despacho (reintegra existencia y libera el cupón)
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                motivo: { type: [string, 'null'], maxLength: 300 }
      responses:
        '200':
          description: Pedido cancelado (detalle)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PedidoDetalle' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: TRANSICION_NO_PERMITIDA (ya despachado, entregado o cancelado)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /pedidos/{id}/estado:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    patch:
      tags: [Pedidos]
      summary: Avanza el estado (Operador y Administrador)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado:
                  { type: string, example: EN_PREPARACION, description: Código del estado destino }
                comentario: { type: [string, 'null'], maxLength: 300 }
      responses:
        '200':
          description: Pedido con su nuevo estado (detalle)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PedidoDetalle' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: >-
            TRANSICION_NO_PERMITIDA (no definida, mismo estado, o destino CANCELADO/DEVUELTO*:
            usa sus endpoints)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /pedidos/{id}/devoluciones:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Pedidos]
      summary: Devoluciones del pedido con sus líneas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Devoluciones, de la más antigua a la más reciente
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Devolucion' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [Pedidos]
      summary: Registra una devolución total o parcial por línea (Operador y Administrador)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo, lineas]
              properties:
                motivo: { type: string, maxLength: 300 }
                lineas:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [idPedidoDetalle, cantidad]
                    properties:
                      idPedidoDetalle: { type: integer, minimum: 1 }
                      cantidad: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Devolución registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevolucionRegistrada' }
        '400':
          description: VALIDACION (línea repetida, de otro pedido, motivo vacío, …)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: TRANSICION_NO_PERMITIDA (el pedido no está ENTREGADO ni DEVUELTO_PARCIAL)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: CANTIDAD_DEVOLUCION_EXCEDIDA (más de lo vendido menos lo ya devuelto)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /perfil:
    get:
      tags: [Perfil]
      summary: Datos del propio usuario
