      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contrasenaActual, contrasenaNueva]
              properties:
                contrasenaActual: { type: string }
                contrasenaNueva:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: Al menos una letra y un número; distinta de la actual
      responses:
        '204':
          description: Contraseña cambiada
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /usuarios:
    get:
